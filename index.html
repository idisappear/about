<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Name | About Me</title>
    <meta name="description" content="Simple personal website with about and contact information." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-2" aria-hidden="true"></div>

    <header class="hero container fade-up">
      <p class="eyebrow">Personal Site</p>
      <div class="markdown hero-markdown" data-md="content/hero.md"></div>
    </header>

    <main class="container grid">
      <section id="about" class="card fade-up delay-1">
        <div class="markdown" data-md="content/about.md"></div>
      </section>

      <section id="contact" class="card fade-up delay-2">
        <div class="markdown" data-md="content/contacts.md"></div>
      </section>
    </main>

    <footer class="container fade-up delay-3">
      <p>&copy; <span id="year"></span> Your Name</p>
    </footer>

    <button id="chat-toggle" class="chat-toggle" type="button" aria-haspopup="dialog" aria-controls="chat-popup">
      AI Chat
    </button>

    <section id="chat-popup" class="chat-popup" role="dialog" aria-label="AI Chat Assistant" aria-hidden="true">
      <div class="chat-header">
        <div>
          <strong>AI Assistant</strong>
          <p>Ask about me, projects, or contacts</p>
        </div>
        <button id="chat-close" class="chat-close" type="button" aria-label="Close chat">x</button>
      </div>

      <div id="chat-messages" class="chat-messages" aria-live="polite"></div>

      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Type your message..." maxlength="600" required />
        <button type="submit">Send</button>
      </form>

      <div class="chat-settings">
        <input id="chat-api-key" type="password" placeholder="sk-... OpenAI API key" autocomplete="off" />
        <button id="chat-save-key" type="button">Connect</button>
        <button id="chat-clear-key" type="button">Disconnect</button>
      </div>
      <p id="chat-status" class="chat-status"></p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="chat.config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
